---
name: Build all containers

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  container-builder:
    strategy:
      fail-fast: false
      matrix:
        image:
          - aur-builder
          - maubot-maubot
          - leafac-killthenewsletter
          - rsync
          - minetools
          - redlib-org-redlib
    runs-on: ubuntu-latest
    steps:
      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%dT%H%M%S')" >> "$GITHUB_OUTPUT"
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Get app version
        id: app-version
        run: echo "app-version=$(cat ${{ matrix.image }}/version)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/jeffcasavant/public-containers/${{ matrix.image }}:latest
            ghcr.io/jeffcasavant/public-containers/${{ matrix.image }}:${{ steps.app-version.outputs.app-version }}
            ghcr.io/jeffcasavant/public-containers/${{ matrix.image }}:${{ steps.app-version.outputs.app-version }}-${{ steps.timestamp.outputs.timestamp }}
